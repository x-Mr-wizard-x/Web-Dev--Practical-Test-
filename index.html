<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="sty.css">
</head>
<body>

    <div class="container">

        <h1>Student Expense Tracker</h1>
        <p class="subtitle">Manage your daily expenses easily</p>

        <div class="total-box">
            <h3>Total Expenses</h3>
            <h2>₹<span id="total">0</span></h2>
        </div>

        <div class="expense-form">
            <h2>Add New Expense</h2>

            <input type="text" id="expenseName"
                placeholder="Enter expense name">

            <input type="number" id="expenseAmount"
                placeholder="Enter amount">

            <select id="category">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <button id="addBtn">Add Expense</button>
        </div>

        <div class="expense-list">
            <h2>Your Expenses</h2>

            <select id="filter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <ul id="expenseList"></ul>
        </div>

    </div>

    <script src="scr.js"></script>
</body>
</html>
